name = "podmash"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[env.production]
name = "podmash-prod"
route = "podmash-prod.workers.dev"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1